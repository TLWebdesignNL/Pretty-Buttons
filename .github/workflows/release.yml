name: Release

on:
  push:
    tags:
      - 'V*'

jobs:
  update-xml:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version and build download URL
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#V}"
          ZIP_NAME="mod_prettybuttons-${VERSION}.zip"
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "zip_url=${ZIP_URL}" >> $GITHUB_OUTPUT

      # Build the package from the tag; export-ignore rules in .gitattributes
      # keep repository-only files out of it.
      - name: Build package and compute SHA256
        id: sha256
        run: |
          git archive --format=zip -o "${{ steps.vars.outputs.zip_name }}" "${{ steps.vars.outputs.tag }}"
          SHA=$(sha256sum "${{ steps.vars.outputs.zip_name }}" | awk '{print $1}')
          echo "value=${SHA}" >> $GITHUB_OUTPUT

      # Publish the package before updates.xml points sites at it.
      - name: Create GitHub Release with the package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          ZIP_NAME: ${{ steps.vars.outputs.zip_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" --title "Pretty Buttons $VERSION" --generate-notes --verify-tag
          fi

      - name: Append entry to updates.xml
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          ZIP_URL: ${{ steps.vars.outputs.zip_url }}
          SHA256: ${{ steps.sha256.outputs.value }}
        run: |
          python3 - <<'EOF'
          import re, os

          version = os.environ["VERSION"]
          zip_url = os.environ["ZIP_URL"]
          sha256  = os.environ["SHA256"]

          with open("updates.xml", "r") as f:
              content = f.read()

          if f"<version>{version}</version>" in content:
              print(f"Version {version} already exists, skipping.")
              raise SystemExit(0)

          # Extract the last <update> block as a template
          blocks = re.findall(r'<update>.*?</update>', content, re.DOTALL)
          if not blocks:
              raise SystemExit("No existing <update> block found to use as template.")
          last = blocks[-1]

          # Point the download at the package attached to the GitHub Release
          new_block, count = re.subn(
              r'(<downloadurl\b[^>]*>\s*)[^<\s]+(\s*</downloadurl>)',
              lambda m: m.group(1) + zip_url + m.group(2),
              last
          )
          if count != 1:
              raise SystemExit("Expected exactly one download URL in the template block.")

          # Update <version> tag
          old_version = re.search(r'<version>([^<]+)</version>', last).group(1).strip()
          new_block = new_block.replace(
              f'<version>{old_version}</version>',
              f'<version>{version}</version>'
          )

          # Update version in <name> if present
          new_block = re.sub(
              r'(<name>[^<]*?)' + re.escape(old_version) + r'([^<]*</name>)',
              lambda m: m.group(0).replace(old_version, version, 1),
              new_block
          )

          # Update sha256
          new_block = re.sub(r'<sha256>[a-f0-9]+</sha256>', f'<sha256>{sha256}</sha256>', new_block)

          # Detect indentation of the last block and match it
          indent = re.match(r'(\s*)', last).group(1)
          new_block = indent + new_block.lstrip()

          content = content.replace('</updates>', new_block + '\n</updates>')
          with open("updates.xml", "w") as f:
              f.write(content)
          print(f"Added version {version} (sha256: {sha256})")
          EOF

      - name: Commit and push updated updates.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: add updates.xml entry for ${{ steps.vars.outputs.tag }}"
          git push origin main
